<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening link…</title><style>body{display:grid;min-height:100vh;margin:0;place-items:center;background:#f6f8fb;color:#041021;font:16px Inter,Arial,sans-serif}.box{max-width:420px;padding:36px;border:1px solid #e1e6ec;border-radius:18px;background:#fff;text-align:center;box-shadow:0 20px 50px #04102114}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#1664bf;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25;transform:scale(.75)}}</style></head><body><div class="box"><span class="dot"></span><h1>Opening the requested page…</h1><p>Your link will open automatically.</p></div><script src="/js/supabase-config.js"></script><script>(async function(){var q=new URLSearchParams(location.search),c=q.get('c'),t=q.get('t'),u=q.get('u');try{var target=new URL(u);if(!/^https?:$/.test(target.protocol))throw new Error('invalid');if(c&&t&&window.SB_SUPABASE){await fetch(SB_SUPABASE.url+'/rest/v1/rpc/cm_track_click',{method:'POST',headers:{apikey:SB_SUPABASE.key,'Content-Type':'application/json'},body:JSON.stringify({target_contact:c,target_template:t,target_url:target.href})});}location.replace(target.href);}catch(e){document.querySelector('.box').innerHTML='<h1>Invalid link</h1><p>This tracked link is incomplete or no longer valid.</p>';}})();</script></body></html>
