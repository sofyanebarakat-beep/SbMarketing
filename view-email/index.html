<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>View email | SB Marketing</title>
<link rel="icon" href="/images/sb-favicon.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100vh;background:#f5f6f8;color:#041021;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  .bar{padding:14px 20px;background:#041021;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
  .bar .brand span:first-child{color:#ff5a4e}
  .bar .brand span:last-child{color:#5c6cff}
  .bar .brand{font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .bar a{color:#c7cfdd;text-decoration:none;font-weight:700}
  .frame-wrap{padding:24px 16px}
  iframe{display:block;width:100%;max-width:640px;margin:0 auto;height:80vh;border:0;border-radius:16px;background:#fff;box-shadow:0 20px 60px rgba(4,16,33,.08)}
  .card{width:min(100%,440px);margin:9vh auto;background:#fff;border:1px solid #e4e7ec;border-radius:24px;padding:40px;box-shadow:0 20px 60px rgba(4,16,33,.08);text-align:center}
  .card .status{font-size:40px;margin-bottom:8px}
  .card h1{font-size:22px;margin:0 0 12px}
  .card p{color:#6b7280;line-height:1.6;margin:0 0 8px}
  .card a.home{display:inline-block;margin-top:20px;color:#b45309;font-weight:700;text-decoration:none;font-size:13px}
</style>
</head>
<body>
  <div class="bar">
    <span class="brand"><span>SB</span><span>MARKETING</span></span>
    <a href="https://www.sbmarketing.fr">sbmarketing.fr</a>
  </div>
  <div id="content"></div>

  <script src="/js/supabase-config.js"></script>
  <script>
  (function () {
    'use strict';
    var config = window.SB_SUPABASE;
    var content = document.getElementById('content');
    function showCard(icon, title, message) {
      content.innerHTML = '<div class="card"><div class="status">' + icon + '</div><h1></h1><p></p><a class="home" href="https://www.sbmarketing.fr">sbmarketing.fr</a></div>';
      content.querySelector('h1').textContent = title;
      content.querySelector('p').textContent = message;
    }

    var params = new URLSearchParams(location.search);
    var id = params.get('id');
    if (!id || !config) { showCard('⚠️', 'Invalid link', 'This link is missing some information.'); return; }

    fetch(config.url + '/rest/v1/rpc/get_email_html', {
      method: 'POST',
      headers: { apikey: config.key, Authorization: 'Bearer ' + config.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ target_id: id })
    }).then(function (res) {
      if (!res.ok) throw new Error('Request failed');
      return res.json();
    }).then(function (html) {
      if (!html) { showCard('⚠️', 'Email not found', "This link has expired or the email couldn't be found."); return; }
      content.innerHTML = '<div class="frame-wrap"><iframe title="Email"></iframe></div>';
      content.querySelector('iframe').srcdoc = html;
    }).catch(function () {
      showCard('⚠️', 'Something went wrong', 'We could not load this email. Please try again later.');
    });
  })();
  </script>
</body>
</html>
