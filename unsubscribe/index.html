<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Unsubscribe | SB Marketing</title>
<link rel="icon" href="/images/sb-favicon.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f6f8;color:#041021;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:24px}
  .card{width:min(100%,440px);background:#fff;border:1px solid #e4e7ec;border-radius:24px;padding:40px;box-shadow:0 20px 60px rgba(4,16,33,.08);text-align:center}
  .brand{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:24px}
  .brand span:first-child{color:#ff5a4e}
  .brand span:last-child{color:#5c6cff}
  h1{font-size:22px;margin:0 0 12px}
  p{color:#6b7280;line-height:1.6;margin:0 0 8px}
  .status{font-size:40px;margin-bottom:8px}
  a.home{display:inline-block;margin-top:20px;color:#b45309;font-weight:700;text-decoration:none;font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span>SB</span><span>MARKETING</span></div>
    <div class="status" id="status">⏳</div>
    <h1 id="title">Processing…</h1>
    <p id="message">One moment.</p>
    <a class="home" href="https://www.sbmarketing.fr">sbmarketing.fr</a>
  </div>

  <script src="/js/supabase-config.js"></script>
  <script>
  (function () {
    'use strict';
    var config = window.SB_SUPABASE;
    var titleEl = document.getElementById('title'), msgEl = document.getElementById('message'), statusEl = document.getElementById('status');
    function show(icon, title, message) { statusEl.textContent = icon; titleEl.textContent = title; msgEl.textContent = message; }

    var params = new URLSearchParams(location.search);
    var clientId = params.get('client');
    if (!clientId || !config) { show('⚠️', 'Invalid link', 'This unsubscribe link is missing some information. Please contact us directly if you want to stop receiving marketing tips.'); return; }

    fetch(config.url + '/rest/v1/rpc/unsubscribe_client', {
      method: 'POST',
      headers: { apikey: config.key, Authorization: 'Bearer ' + config.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ target_id: clientId })
    }).then(function (res) {
      if (!res.ok) throw new Error('Request failed');
      show('✅', "You're unsubscribed", "You won't receive marketing tips from SB Marketing anymore. If you're an active client, you'll still receive your monthly report — that's part of the service.");
    }).catch(function () {
      show('⚠️', 'Something went wrong', 'We could not process this automatically. Please reply to any of our emails and we will unsubscribe you by hand.');
    });
  })();
  </script>
</body>
</html>
