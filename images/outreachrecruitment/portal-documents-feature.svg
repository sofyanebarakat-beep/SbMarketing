<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title"><title id="title">Outreach document workflow concept</title><rect width="1200" height="760" fill="#ebeaf4"/><rect x="105" y="80" width="990" height="600" rx="24" fill="#fff"/><g font-family="Arial,sans-serif"><text x="160" y="155" fill="#25236b" font-size="36" font-weight="700">Document workflow</text><text x="160" y="190" fill="#77758e" font-size="17">Upload, review and follow every requirement</text><rect x="160" y="245" width="880" height="100" rx="16" fill="#f7f7fb"/><rect x="190" y="268" width="52" height="54" rx="8" fill="#e7e6ff"/><path d="M204 282h24v4h-24zm0 10h24v4h-24zm0 10h17v4h-17z" fill="#4c49c5"/><text x="270" y="287" fill="#25236b" font-size="17" font-weight="700">Employment contract</text><text x="270" y="314" fill="#77758e" font-size="14">PDF · Uploaded today</text><rect x="830" y="270" width="155" height="42" rx="21" fill="#e4f6e9"/><text x="873" y="297" fill="#278447" font-size="14" font-weight="700">Approved</text><rect x="160" y="370" width="880" height="100" rx="16" fill="#f7f7fb"/><rect x="190" y="393" width="52" height="54" rx="8" fill="#fff0ee"/><path d="M204 407h24v4h-24zm0 10h24v4h-24zm0 10h17v4h-17z" fill="#ee2e24"/><text x="270" y="412" fill="#25236b" font-size="17" font-weight="700">Identity document</text><text x="270" y="439" fill="#77758e" font-size="14">A clearer scan is required</text><rect x="810" y="395" width="175" height="42" rx="21" fill="#fff0ee"/><text x="837" y="422" fill="#c53e34" font-size="14" font-weight="700">Update needed</text><rect x="160" y="495" width="880" height="100" rx="16" fill="#f7f7fb"/><text x="190" y="542" fill="#25236b" font-size="17" font-weight="700">Comments stay with each file</text><text x="190" y="568" fill="#77758e" font-size="14">Everyone sees the request and its current status.</text></g></svg>
