<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Leads Admin | SB Marketing</title>
  <link rel="icon" href="/images/sb-favicon.png">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <section class="login-card" data-login-view>
      <a href="/" class="admin-brand" aria-label="SB Marketing home"><img src="/images/logo-climanova.svg" alt="SB Marketing"></a>
      <span class="admin-kicker">Private area</span>
      <h1>Lead administration</h1>
      <p>Sign in to review requests submitted through the butcher marketing pages.</p>
      <form data-login-form>
        <label>Email<input name="email" type="email" autocomplete="username" required value="sofyanebarakat@gmail.com"></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
        <p class="form-message" data-login-message aria-live="polite"></p>
      </form>
    </section>

    <section class="dashboard" data-dashboard hidden>
      <header class="admin-header">
        <div><span class="admin-kicker">SB Marketing</span><h1>Butcher leads</h1><p data-last-update></p></div>
        <div class="header-actions"><button class="secondary" type="button" data-refresh>Refresh</button><button class="secondary" type="button" data-export>Export CSV</button><button type="button" data-logout>Sign out</button></div>
      </header>
      <div class="stats" aria-label="Lead summary">
        <article><span>Total leads</span><strong data-stat-total>0</strong></article>
        <article><span>New</span><strong data-stat-new>0</strong></article>
        <article><span>Contacted</span><strong data-stat-contacted>0</strong></article>
        <article><span>Customers</span><strong data-stat-customer>0</strong></article>
      </div>
      <div class="toolbar"><label class="search"><span class="sr-only">Search leads</span><input type="search" data-search placeholder="Search name, shop, email, city…"></label><select data-status-filter aria-label="Filter by status"><option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="qualified">Qualified</option><option value="customer">Customer</option><option value="closed">Closed</option></select></div>
      <p class="dashboard-message" data-dashboard-message aria-live="polite"></p>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Contact</th><th>Butcher shop</th><th>Location</th><th>Website</th><th>Language</th><th>Status</th></tr></thead><tbody data-leads-body></tbody></table></div>
      <div class="empty" data-empty hidden><h2>No leads found</h2><p>New form submissions will appear here.</p></div>
    </section>
  </main>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
